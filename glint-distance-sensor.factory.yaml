# Glint Distance Sensor - factory firmware
# This is what the GitHub workflow builds and what ships on new units / the web
# installer. It adds onboarding and update features on top of the core config;
# a user who takes control in their ESPHome dashboard imports only the core file.

packages:
  core: !include glint-distance-sensor.yaml

esphome:
  project:
    # Home Assistant shows the part before the dot as the manufacturer ("by ...")
    # and the part after it as the model.
    name: Craig Thompson.Glint Distance Sensor
    version: dev  # replaced with the release version by the GitHub workflow

# Lets the ESPHome dashboard offer "Take Control" for discovered units.
dashboard_import:
  package_import_url: github://craigthompson/glint-distance-sensor/glint-distance-sensor.yaml@main
  import_full_config: false

# Wi-Fi onboarding over Bluetooth (Home Assistant, or a Web Bluetooth page).
# No button press needed: the BOOT button is inside the case, and the open setup
# hotspot already lets anyone nearby configure an unconfigured device. Improv
# stops once the device has Wi-Fi.
esp32_ble:
  name: glint  # advertised as glint-XXXXXX; short enough to fit a BLE packet

improv_ble:
  authorizer: none

# Optional Bluetooth proxy, off by default (Bluetooth Proxy switch below).
# Scanning shares the radio with Wi-Fi, so it only runs while the switch is on.
esp32_ble_tracker:
  id: ble_tracker
  scan_parameters:
    continuous: false

bluetooth_proxy:
  active: true

switch:
  - platform: template
    id: bt_proxy
    name: Bluetooth Proxy
    icon: mdi:bluetooth
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    # With continuous scanning set, the tracker starts scanning by itself once
    # Bluetooth is up, which also covers restoring the switch at boot. Uses
    # id(ble_tracker): the switch restores before the tracker has set itself up.
    on_turn_on:
      - lambda: |-
          auto *tracker = id(ble_tracker);
          tracker->set_scan_continuous(true);
          auto *ble = esp32_ble::global_ble;  // null until esp32_ble has set itself up
          if (ble != nullptr && ble->is_active()) tracker->start_scan_if_idle();
    on_turn_off:
      - lambda: |-
          auto *tracker = id(ble_tracker);
          tracker->set_scan_continuous(false);
          if (tracker->scan_running()) tracker->stop_scan();

interval:
  # Home Assistant can change the scanner mode, which restarts scanning; keep
  # it stopped while the proxy is switched off.
  - interval: 10s
    then:
      - lambda: |-
          auto *tracker = id(ble_tracker);
          if (!id(bt_proxy).state && tracker->scan_running()) {
            tracker->set_scan_continuous(false);
            tracker->stop_scan();
          }

# Wi-Fi onboarding over USB from the web installer.
improv_serial:

# Firmware updates published as GitHub releases appear in Home Assistant.
http_request:

ota:
  - platform: http_request
    on_begin:
      - lambda: 'id(updating) = true; id(led_output).set_level(1.0f);'
    on_error:
      - lambda: 'id(updating) = false;'

update:
  - platform: http_request
    id: firmware_update
    name: Firmware
    source: https://craigthompson.github.io/glint-distance-sensor/firmware/glint-distance-sensor.manifest.json

# Checks GitHub for new firmware now instead of waiting for the 6-hourly check.
button:
  - platform: template
    name: Check for Firmware Update
    icon: mdi:cloud-refresh
    entity_category: diagnostic
    on_press:
      - component.update: firmware_update
