<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0f1318">
<title>{{ site.title }}</title>
<meta name="description" content="{{ site.description }}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%233d97ff'/%3E%3Cpath d='M12 5v9M8.5 10.5 12 14l3.5-3.5M7 18.5h10' fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #0f1318;
  --bg-glow: #13233a;
  --card: #1a2028;
  --card-raised: #222a34;
  --line: #2a323d;
  --text: #e8edf3;
  --muted: #93a0ae;
  --accent: #3d97ff;
  --accent-soft: #7ab8ff;

  /* ESP Web Tools install button */
  --esp-tools-button-color: var(--accent);
  --esp-tools-button-text-color: #fff;
  --esp-tools-button-border-radius: 10px;

  /* ESP Web Tools dialog (Material 3 tokens; inherited into its shadow DOM) */
  --md-sys-color-primary: var(--accent-soft);
  --md-sys-color-on-primary: #00315f;
  --md-sys-color-primary-container: #1d4677;
  --md-sys-color-secondary: #b8c8dc;
  --md-sys-color-secondary-container: #2a3a50;
  --md-sys-color-on-secondary-container: #d6e3ff;
  --md-sys-color-tertiary: #d3bfe6;
  --md-sys-color-tertiary-container: #4f3f63;
  --md-sys-color-surface: var(--card);
  --md-sys-color-surface-container: var(--card);
  --md-sys-color-surface-container-high: var(--card-raised);
  --md-sys-color-surface-container-highest: #2c3540;
  --md-sys-color-on-surface: var(--text);
  --md-sys-color-on-surface-variant: var(--muted);
  --md-sys-color-outline-variant: var(--line);
  --md-sys-color-error: #ffb4ab;
  --md-sys-color-on-error-container: #ffdad6;
  --md-sys-color-scrim: #000;
  --md-sys-color-shadow: #000;
  --mdc-theme-primary: var(--accent-soft);
}
/* ESP Web Tools' pop-ups (install / Wi-Fi / logs, and "No port selected") set a
   light palette on their own :host, which wins over the inherited values above.
   Page styles on the host element itself take precedence over :host, so set
   the dark palette here too. */
ewt-install-dialog,
ewt-no-port-picked-dialog {
  --text-color: rgba(232, 237, 243, .78);
  --danger-color: #ff8a80;
  --md-sys-color-primary: var(--accent-soft);
  --md-sys-color-on-primary: #00315f;
  --md-sys-color-surface: var(--card-raised);
  --md-sys-color-surface-container: var(--card-raised);
  --md-sys-color-surface-container-high: var(--card-raised);
  --md-sys-color-surface-container-highest: #2c3540;
  --md-sys-color-secondary-container: #2a3a50;
  --md-sys-color-on-secondary-container: #d6e3ff;
  --md-sys-color-on-surface: var(--text);
  --md-sys-color-on-surface-variant: var(--muted);
  --md-sys-color-outline: #5b6673;
  --md-sys-color-outline-variant: var(--line);
  --md-dialog-container-color: var(--card-raised);
  --md-dialog-headline-color: var(--text);
  --md-dialog-supporting-text-color: rgba(232, 237, 243, .78);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0;
  color: var(--text);
  background: radial-gradient(1100px 520px at 50% -180px, var(--bg-glow), var(--bg) 70%) no-repeat, var(--bg);
  font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }

header.hero { text-align: center; padding: 56px 0 28px; }
.logo {
  width: 72px; height: 72px; margin: 0 auto 18px; border-radius: 20px;
  background: var(--accent); display: flex; align-items: center; justify-content: center;
  box-shadow: 0 10px 30px rgba(61, 151, 255, .35);
}
.logo svg { width: 42px; height: 42px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.hero h1 { font-size: clamp(1.8rem, 5vw, 2.4rem); line-height: 1.2; margin: 0 0 8px; letter-spacing: -.02em; }
.hero p { color: var(--muted); margin: 0; font-size: 1.05rem; }

main.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 18px;
  padding: 8px 28px 28px; margin-bottom: 32px;
}
/* The page title is in the header, so hide the duplicate from the markdown. */
main.card > h1:first-child { display: none; }
main h2 {
  font-size: 1.25rem; margin: 32px 0 12px; padding-top: 24px;
  border-top: 1px solid var(--line); letter-spacing: -.01em;
}
main h2:first-of-type { border-top: 0; padding-top: 12px; }
main p, main li { color: #cfd7e1; }
main strong { color: var(--text); }
main ul, main ol { padding-left: 22px; }
main li { margin: 6px 0; }
main li::marker { color: var(--accent); }
a { color: var(--accent-soft); text-decoration: none; }
a:hover { text-decoration: underline; }
code {
  font: .9em ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  background: var(--card-raised); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px;
}
esp-web-install-button { display: block; margin: 20px 0; }
.note {
  background: var(--card-raised); border: 1px solid var(--line); border-left: 3px solid var(--accent);
  border-radius: 10px; padding: 12px 14px; color: var(--muted);
}

footer { text-align: center; color: var(--muted); font-size: .9rem; padding: 0 0 48px; }
footer a { color: var(--muted); text-decoration: underline; }

@media (max-width: 520px) {
  header.hero { padding-top: 40px; }
  main.card { padding: 4px 18px 22px; border-radius: 14px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M12 3v13M7 11l5 5 5-5M4 21h16"/></svg></div>
    <h1>{{ site.title }}</h1>
    <p>{{ site.description }}</p>
  </header>
  <main class="card">
{{ content }}
  </main>
  <footer>
    <a href="https://github.com/craigthompson/glint-distance-sensor">Source on GitHub</a> · Powered by <a href="https://esphome.io/">ESPHome</a> and <a href="https://esphome.github.io/esp-web-tools/">ESP Web Tools</a>
  </footer>
</div>
</body>
</html>
