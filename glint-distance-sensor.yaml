# Glint Distance Sensor - core configuration
# ESP32-C3 Super Mini + VL53L0X time-of-flight sensor, USB powered.
# https://github.com/craigthompson/glint-distance-sensor
#
# This is the file a user's ESPHome dashboard imports on "Take Control".
# Factory-only extras (Improv onboarding, firmware updates from GitHub) live in
# glint-distance-sensor.factory.yaml.
#
# Wiring:
#   VL53L0X VIN   -> 3.3V
#   VL53L0X GND   -> GND
#   VL53L0X SCL   -> IO6
#   VL53L0X SDA   -> IO7
#   VL53L0X XSHUT -> IO5   (hardware reset at every boot; the GPIO1 interrupt pin is not used)
#   Onboard LED   =  IO8   (active low; status patterns, see the LED interval)
#   BOOT button   =  IO9   (hold 10 s for factory reset)

substitutions:
  device_name: glint-distance-sensor
  friendly_name: Glint Distance Sensor
  # Ambient IR Level thresholds in kcps. Provisional: tune with indoor vs. direct
  # sunlight tests on real installations.
  ambient_ir_moderate_kcps: "200"
  ambient_ir_high_kcps: "1000"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  on_boot:
    # Hardware-reset the VL53L0X at every boot, before its driver sets it up
    # (priority 600). A restart or update reboots only the ESP32; the sensor
    # stays powered and can stay stuck, returning nothing but out-of-range
    # readings until it is unplugged. Holding XSHUT low puts it in hardware
    # standby, the same as cutting its power. The pin is already low since
    # the xshut output's setup; hold it 10 ms, then release and give the
    # sensor its 1.2 ms (max) firmware boot time.
    - priority: 700
      then:
        - lambda: |-
            delay(10);
            // While held in reset the sensor must not answer on I2C. If it
            // does, XSHUT isn't connected and only unplugging resets it.
            uint8_t model = 0;
            if (id(vl53_raw).read_byte(0xC0, &model))
              ESP_LOGW("xshut", "Sensor answered while held in reset (model 0x%02X): XSHUT not connected?", model);
            id(xshut).turn_on();
            delay(2);
    # Factory reset without opening the case: unplug and replug 5 times in a
    # row, each within 10 s of plugging in. Counts power-on boots only, so
    # updates, restarts and crashes never trigger it. Saved straight to flash
    # because power can be cut again within seconds.
    - priority: 600
      then:
        - lambda: |-
            auto pref = global_preferences->make_preference<uint8_t>(fnv1_hash("glint_power_cycles"));
            uint8_t count = 0;
            if (!pref.load(&count)) count = 0;
            count = esp_reset_reason() == ESP_RST_POWERON ? count + 1 : 0;
            pref.save(&count);
            global_preferences->sync();
            id(power_cycles) = count;
            if (count > 1) ESP_LOGW("reset", "Quick power cycle %u of 5", count);
    - priority: -100
      then:
        - if:
            condition:
              lambda: 'return id(power_cycles) >= 5;'
            then:
              - logger.log:
                  level: WARN
                  tag: reset
                  format: "5 quick power cycles: factory reset"
              - button.press: factory_reset_button
        - light.turn_on:
            id: status_led
            effect: Breathe
        - delay: 10s
        - lambda: |-
            auto pref = global_preferences->make_preference<uint8_t>(fnv1_hash("glint_power_cycles"));
            uint8_t count = 0;
            pref.save(&count);
            global_preferences->sync();
            id(power_cycles) = 0;

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

# ESPHome's captive_portal with a branded setup page
# (components/captive_portal/portal.html -> run tools/build_captive_portal.py).
external_components:
  - source: github://craigthompson/glint-distance-sensor@main
    components: [captive_portal]

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

api:
  # No key: Home Assistant provisions a unique encryption key when the device is adopted.
  encryption:
  # A product should keep working (and measuring) when Home Assistant is down.
  reboot_timeout: 0s
  on_client_connected:
    - delay: 10s
    - if:
        condition:
          and:
            - switch.is_on: scheduled_measurements
            - not:
                script.is_running: measure
        then:
          - lambda: 'id(ms_since_measure) = 0;'
          - script.execute: measure

ota:
  - platform: esphome
    on_begin:
      - lambda: 'id(updating) = true; id(led_output).set_level(1.0f);'
    on_error:
      - lambda: 'id(updating) = false;'

wifi:
  # The device runs on USB power, so keep the radio awake. ESPHome's default on
  # ESP32 ("light") lets it doze between beacons, which slowed replies from
  # under 10 ms to 200-500 ms.
  power_save_mode: none
  ap:
    ssid: "Glint Distance Sensor Setup"

captive_portal:

i2c:
  id: bus_a
  sda: GPIO7
  scl: GPIO6
  frequency: 400kHz
  scan: false

# Restart reason, free memory and loop time diagnostics.
debug:
  update_interval: 5min

# Clock from Home Assistant, for the Last Measurement timestamp.
time:
  - platform: homeassistant
    id: ha_time

globals:
  # Quick power cycles counted at boot (see esphome: on_boot).
  - id: power_cycles
    type: uint8_t
    initial_value: '0'

  - id: measuring
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: sample_sum
    type: float
    restore_value: no
    initial_value: '0'
  - id: sample_count
    type: int
    restore_value: no
    initial_value: '0'
  # Sums of the VL53L0X's signal and ambient rates (kcps) over valid samples.
  - id: signal_sum
    type: float
    restore_value: no
    initial_value: '0'
  - id: ambient_sum
    type: float
    restore_value: no
    initial_value: '0'
  # The same rates over every completed reading, valid or not, so Home
  # Assistant still gets them when nothing is in range.
  - id: any_signal_sum
    type: float
    restore_value: no
    initial_value: '0'
  - id: any_ambient_sum
    type: float
    restore_value: no
    initial_value: '0'
  - id: any_rate_count
    type: int
    restore_value: no
    initial_value: '0'
  - id: sample_min
    type: float
    restore_value: no
    initial_value: 'NAN'
  - id: sample_max
    type: float
    restore_value: no
    initial_value: 'NAN'
  # Readings the sensor reported during this measurement, valid or not
  # (out of range counts). Zero means the sensor never answered.
  # reading_count when the current sample was started; the measure script waits
  # for it to change.
  - id: reading_count_at_start
    type: int
    restore_value: no
    initial_value: '0'
  - id: reading_count
    type: int
    restore_value: no
    initial_value: '0'
  - id: attempt_count
    type: int
    restore_value: no
    initial_value: '0'
  - id: sensor_fault
    type: bool
    restore_value: no
    initial_value: 'false'
  # Sensor-reset reboots since the last good measurement. Kept across reboots
  # so a dead or unplugged sensor can't cause a reboot loop.
  - id: recovery_attempts
    type: int
    restore_value: yes
    initial_value: '0'
  - id: ms_since_measure
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: led_was_on
    type: bool
    restore_value: no
    initial_value: 'false'
  # Brightness the Status LED light asks for; the LED interval shows it unless
  # a status pattern takes over.
  - id: user_led_level
    type: float
    restore_value: no
    initial_value: '0'
  - id: updating
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: prev_effect
    type: std::string
    restore_value: no
    initial_value: '"Breathe"'

output:
  # VL53L0X XSHUT: low holds the sensor in reset (see esphome: on_boot).
  - platform: gpio
    id: xshut
    pin: GPIO5
  - platform: ledc
    id: led_output
    pin: GPIO8
    inverted: true
  # The Status LED light drives this; the LED interval passes it on to the LED.
  - platform: template
    id: user_led_output
    type: float
    write_action:
      - lambda: 'id(user_led_level) = state;'

light:
  - platform: monochromatic
    id: status_led
    name: Status LED
    output: user_led_output
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 0s
    # Home Assistant's plain "turn on" sends no effect, which would leave the LED
    # solid. Default back to Breathe; picking "None" afterwards still gives solid.
    on_turn_on:
      - if:
          condition:
            lambda: 'return id(status_led).get_effect_name() == "None";'
          then:
            - light.turn_on:
                id: status_led
                effect: Breathe
    effects:
      - pulse:
          name: Breathe
          transition_length: 2s
          update_interval: 2s
          min_brightness: 0%
          max_brightness: 100%
      - strobe:
          name: Measuring
          colors:
            - state: true
              brightness: 100%
              duration: 100ms
            - state: false
              duration: 100ms

binary_sensor:
  # On when the sensor stops responding (see the measure script); off after a
  # successful measurement or a clean "nothing in range" result.
  - platform: template
    id: sensor_problem
    name: Sensor Problem
    device_class: problem
    entity_category: diagnostic

  - platform: gpio
    id: boot_button
    name: Button
    internal: true
    pin:
      number: GPIO9
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 20ms
    on_click:
      # Hold the BOOT button 10 s to wipe Wi-Fi and settings.
      - min_length: 10s
        max_length: 60s
        then:
          - button.press: factory_reset_button

sensor:
  # Raw readings; only used by the measure script, never shown in Home Assistant.
  - platform: vl53l0x
    id: vl53_raw
    internal: true
    i2c_id: bus_a
    address: 0x29
    long_range: true
    timeout: 500ms
    update_interval: never
    on_value:
      then:
        - lambda: |-
            // The vl53l0x component reports metres; everything else here is mm.
            if (!id(measuring)) return;
            id(reading_count) += 1;
            // The driver only reads the range, but the rest of the result block
            // stays valid until the next reading: signal rate at 0x1A and ambient
            // rate at 0x1C, both 9.7 fixed point in mega-counts per second (Mcps).
            // Stored in kilo-counts per second (kcps): Mcps * 1000.
            uint16_t sig_raw, amb_raw;
            const bool rates = id(vl53_raw).read_byte_16(0x1A, &sig_raw) && id(vl53_raw).read_byte_16(0x1C, &amb_raw);
            const float signal = sig_raw / 128.0f * 1000.0f, ambient = amb_raw / 128.0f * 1000.0f;
            if (rates) {
              id(any_signal_sum) += signal;
              id(any_ambient_sum) += ambient;
              id(any_rate_count) += 1;
            }
            if (!std::isnan(x) && x > 0) {
              const float mm = x * 1000.0f;
              id(sample_sum) += mm;
              id(sample_count) += 1;
              if (std::isnan(id(sample_min)) || mm < id(sample_min)) id(sample_min) = mm;
              if (std::isnan(id(sample_max)) || mm > id(sample_max)) id(sample_max) = mm;
              if (rates) {
                id(signal_sum) += signal;
                id(ambient_sum) += ambient;
              }
            }

  - platform: template
    id: distance
    name: Distance
    unit_of_measurement: mm
    device_class: distance
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

  # Optional mapping of distance onto a 0-100 % range set by the user
  # (e.g. salt or bin fill level). Unavailable until both ends are set.
  - platform: template
    id: percentage
    name: Percentage
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
    lambda: |-
      const float d = id(distance).state;
      const float d0 = id(zero_pct_distance).state;
      const float d100 = id(full_pct_distance).state;
      if (std::isnan(d) || std::isnan(d0) || std::isnan(d100) || d0 == d100) {
        return NAN;
      }
      float pct = (d0 - d) / (d0 - d100) * 100.0f;
      if (pct < 0.0f) pct = 0.0f;
      if (pct > 100.0f) pct = 100.0f;
      return pct;

  # Measurement quality, published by the measure script.
  - platform: template
    id: valid_samples
    name: Valid Samples
    icon: mdi:check-circle-outline
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
    entity_category: diagnostic

  - platform: template
    id: reading_spread
    name: Reading Spread
    icon: mdi:arrow-expand-vertical
    unit_of_measurement: mm
    device_class: distance
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
    entity_category: diagnostic

  # How strongly the target reflects the sensor's laser. Low values mean a dark,
  # angled or distant target and less reliable readings.
  - platform: template
    id: signal_strength
    name: Signal Strength
    icon: mdi:signal
    unit_of_measurement: kcps
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
    entity_category: diagnostic
    disabled_by_default: true

  # Infrared (940 nm) ambient light seen by the sensor - not visible light, so
  # not convertible to lux. Strong IR (sunlight, incandescent bulbs) adds noise
  # and shortens the usable range.
  - platform: template
    id: ambient_ir
    name: Ambient IR
    icon: mdi:white-balance-sunny
    unit_of_measurement: kcps
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
    entity_category: diagnostic

  - platform: wifi_signal
    name: Wi-Fi Signal
    update_interval: 5min
    entity_category: diagnostic

  - platform: uptime
    name: Uptime
    update_interval: 60s
    entity_category: diagnostic

  # Temperature of the ESP32-C3 chip itself, not the room.
  - platform: internal_temperature
    name: Chip Temperature
    update_interval: 5min
    entity_category: diagnostic

  - platform: debug
    free:
      name: Free Memory
      disabled_by_default: true
    loop_time:
      name: Loop Time
      disabled_by_default: true

text_sensor:
  # Why the last measurement did or didn't give a distance.
  - platform: template
    id: measurement_result
    name: Measurement Result
    icon: mdi:ruler
    update_interval: never
    entity_category: diagnostic

  # When the last measurement ran. Sent as ISO 8601 text: a numeric sensor is a
  # 32-bit float, which rounds Unix timestamps to the nearest 128 s.
  - platform: template
    id: last_measurement
    name: Last Measurement
    device_class: timestamp
    update_interval: never
    entity_category: diagnostic

  - platform: version
    name: Firmware Version
    hide_timestamp: true
    entity_category: diagnostic

  - platform: debug
    reset_reason:
      name: Last Restart Reason
      icon: mdi:restart-alert

  # Plain-language version of Ambient IR, using the thresholds in substitutions.
  - platform: template
    id: ambient_ir_level
    name: Ambient IR Level
    icon: mdi:weather-sunny-alert
    entity_category: diagnostic

  - platform: wifi_info
    ip_address:
      name: IP Address
      disabled_by_default: true
    ssid:
      name: Wi-Fi Network
      disabled_by_default: true
    bssid:
      name: Access Point
      disabled_by_default: true

number:
  - platform: template
    id: zero_pct_distance
    name: 0% Distance
    unit_of_measurement: mm
    icon: mdi:arrow-collapse-down
    min_value: 0
    max_value: 2000
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0
    entity_category: config
    on_value:
      - component.update: percentage

  - platform: template
    id: full_pct_distance
    name: 100% Distance
    unit_of_measurement: mm
    icon: mdi:arrow-collapse-up
    min_value: 0
    max_value: 2000
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0
    entity_category: config
    on_value:
      - component.update: percentage

  - platform: template
    id: measure_interval
    name: Measurement Interval
    unit_of_measurement: s
    icon: mdi:timer-outline
    # A measurement takes about 0.2-0.35 s at the default 5 samples.
    min_value: 0.5
    max_value: 86400
    step: 0.1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 1800
    entity_category: config

  - platform: template
    id: samples_per_measurement
    name: Samples per Measurement
    icon: mdi:counter
    min_value: 1
    max_value: 10
    step: 1
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 5
    entity_category: config

switch:
  # Turns scheduled measurements on and off. While off, the device doesn't
  # measure on its interval or when Home Assistant connects; Measure Now still
  # works. Turning it back on measures right away.
  - platform: template
    id: scheduled_measurements
    name: Scheduled Measurements
    icon: mdi:play-pause
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - if:
          condition:
            not:
              script.is_running: measure
          then:
            - lambda: 'id(ms_since_measure) = 0;'
            - script.execute: measure

button:
  - platform: template
    name: Measure Now
    icon: mdi:ruler
    on_press:
      - if:
          condition:
            not:
              script.is_running: measure
          then:
            - lambda: 'id(ms_since_measure) = 0;'
            - script.execute: measure

  - platform: restart
    name: Restart
    entity_category: diagnostic

  - platform: factory_reset
    id: factory_reset_button
    name: Factory Reset
    entity_category: config
    disabled_by_default: true

script:
  - id: measure
    mode: single
    then:
      # Flash the LED while measuring, if the user has it on.
      - lambda: |-
          id(led_was_on) = id(status_led).current_values.is_on();
          id(prev_effect) = id(status_led).get_effect_name();
          id(sample_sum) = 0;
          id(sample_count) = 0;
          id(sample_min) = NAN;
          id(sample_max) = NAN;
          id(signal_sum) = 0;
          id(ambient_sum) = 0;
          id(any_signal_sum) = 0;
          id(any_ambient_sum) = 0;
          id(any_rate_count) = 0;
          id(reading_count) = 0;
          id(attempt_count) = 0;
          id(sensor_fault) = false;
          id(measuring) = true;
      - if:
          condition:
            lambda: 'return id(led_was_on);'
          then:
            - light.turn_on:
                id: status_led
                effect: Measuring
      # Near the edge of the sensor's range some samples come back out of range,
      # so keep sampling until we have the requested number of valid samples,
      # up to twice as many attempts.
      - while:
          condition:
            lambda: |-
              const int wanted = (int) id(samples_per_measurement).state;
              return id(sample_count) < wanted && id(attempt_count) < wanted * 2;
          then:
            - lambda: |-
                id(attempt_count) += 1;
                id(reading_count_at_start) = id(reading_count);
            - component.update: vl53_raw
            # A reading takes about 35 ms. Wait for it rather than a fixed time:
            # starting the next one early makes the driver drop it.
            - wait_until:
                condition:
                  lambda: 'return id(reading_count) != id(reading_count_at_start);'
                timeout: 600ms
      - lambda: |-
          id(measuring) = false;
          const int wanted = (int) id(samples_per_measurement).state;
          const int needed = (wanted + 1) / 2;  // at least half the requested samples must be valid
          if (id(sample_count) >= needed && id(sample_count) > 0) {
            const float mm = id(sample_sum) / id(sample_count);
            ESP_LOGI("measure", "Distance %.0f mm (%d valid samples in %d attempts)", mm, id(sample_count), id(attempt_count));
            id(distance).publish_state(mm);
            if (id(recovery_attempts) != 0) id(recovery_attempts) = 0;
          } else {
            id(distance).publish_state(NAN);
            // Nothing in range is a normal result: the sensor still completes its
            // readings. It's a fault when the sensor failed setup, never answered,
            // or the driver flagged a reading that never finished (stuck sensor).
            const bool failed = id(vl53_raw).is_failed();
            const bool stuck = id(vl53_raw).status_has_warning();
            id(sensor_fault) = failed || stuck || id(reading_count) == 0;
            if (id(sensor_fault)) {
              ESP_LOGW("measure", "Sensor fault: %d valid samples in %d attempts, %d readings, failed=%d, stuck=%d",
                       id(sample_count), id(attempt_count), id(reading_count), failed, stuck);
            } else {
              ESP_LOGI("measure", "Nothing in range (%d valid samples in %d attempts)", id(sample_count), id(attempt_count));
            }
          }
          id(sensor_problem).publish_state(id(sensor_fault));
          id(measurement_result).publish_state(
              id(sensor_fault) ? "Sensor not responding"
              : !std::isnan(id(distance).state) ? "OK" : "Nothing in range");
          id(valid_samples).publish_state(id(sample_count));
          id(reading_spread).publish_state(id(sample_count) >= 2 ? id(sample_max) - id(sample_min) : NAN);
          // Average over the valid samples; with none, over every reading, so a
          // covered sensor (strong signal) and an empty view (none) look different.
          const bool valid = id(sample_count) > 0;
          const int n = valid ? id(sample_count) : id(any_rate_count);
          if (n > 0) {
            const float signal = (valid ? id(signal_sum) : id(any_signal_sum)) / n;
            const float ambient = (valid ? id(ambient_sum) : id(any_ambient_sum)) / n;
            id(signal_strength).publish_state(signal);
            id(ambient_ir).publish_state(ambient);
            id(ambient_ir_level).publish_state(ambient >= ${ambient_ir_high_kcps} ? "High"
                                               : ambient >= ${ambient_ir_moderate_kcps} ? "Moderate" : "Low");
            ESP_LOGI("measure", "Signal %.0f kcps, ambient IR %.0f kcps", signal, ambient);
          }
          auto now = id(ha_time).utcnow();
          if (now.is_valid()) id(last_measurement).publish_state(now.strftime("%Y-%m-%dT%H:%M:%SZ"));
      - component.update: percentage
      - if:
          condition:
            lambda: 'return id(led_was_on);'
          then:
            - light.turn_on:
                id: status_led
                effect: !lambda 'return id(prev_effect);'
      # Sensor fault: reset the VL53L0X and reboot so the driver sets it up from
      # scratch. Send its I2C soft-reset command too, then the reboot resets it
      # in hardware through XSHUT (esphome: on_boot). Gives up after 3
      # tries without a good measurement, to avoid a reboot loop.
      - if:
          condition:
            lambda: 'return id(sensor_fault) && id(recovery_attempts) < 3;'
          then:
            - lambda: |-
                id(recovery_attempts) += 1;
                ESP_LOGW("measure", "Resetting sensor and rebooting (attempt %d of 3)", id(recovery_attempts));
                global_preferences->sync();
                id(vl53_raw).write_byte(0xBF, 0x00);  // SOFT_RESET_GO2_SOFT_RESET_N: enter reset
            - delay: 10ms
            - lambda: 'id(vl53_raw).write_byte(0xBF, 0x01);  // leave reset'
            - delay: 500ms
            - lambda: 'App.safe_reboot();'
      - if:
          condition:
            lambda: 'return id(sensor_fault) && id(recovery_attempts) >= 3;'
          then:
            - logger.log:
                level: ERROR
                format: "Sensor still not responding after 3 resets; check wiring or power-cycle the device"

interval:
  # Status LED. Important states take over the LED with their own pattern;
  # otherwise it shows the Status LED light as set in Home Assistant.
  #   Firmware update           solid on
  #   Factory reset counting    very fast flicker (power cycles 2-4 of 5)
  #   Needs Wi-Fi setup         slow blink, 1 s on / 1 s off
  #   Connecting to Wi-Fi       fast blink
  #   Not connected to HA       2 blinks, pause   (only while the LED is on)
  #   Sensor problem            3 blinks, pause   (only while the LED is on)
  #   Normal                    the Status LED light: breathing, flashing while measuring
  - interval: 20ms
    then:
      - lambda: |-
          if (id(updating)) return;  // left solid on by ota on_begin
          const uint32_t t = millis();
          // n short blinks, then a pause, repeating every `period` ms
          auto blinks = [t](uint32_t n, uint32_t period) {
            const uint32_t p = t % period;
            return p < n * 300 && p % 300 < 150;
          };
          const bool led_on = id(status_led).current_values.is_on();
          bool on;
          if (id(power_cycles) >= 2) {
            on = t % 100 < 50;
          } else if (!wifi::global_wifi_component->has_sta()) {
            on = t % 2000 < 1000;
          } else if (!wifi::global_wifi_component->is_connected()) {
            on = t % 250 < 125;
          } else if (led_on && !api::global_api_server->is_connected()) {
            on = blinks(2, 2000);
          } else if (led_on && id(sensor_problem).state) {
            on = blinks(3, 2500);
          } else {
            id(led_output).set_level(id(user_led_level));
            return;
          }
          id(led_output).set_level(on ? 1.0f : 0.0f);

  # Measurement scheduler. Ticks every 100 ms so the interval can be a fraction
  # of a second (e.g. 0.7 s for parking guidance).
  - interval: 100ms
    then:
      - lambda: 'if (id(ms_since_measure) < 4000000000u) id(ms_since_measure) += 100;  // no wraparound'
      - if:
          condition:
            and:
              - switch.is_on: scheduled_measurements
              - lambda: 'return id(ms_since_measure) >= (uint32_t) lroundf(id(measure_interval).state * 1000.0f);'
              - not:
                  script.is_running: measure
          then:
            - lambda: 'id(ms_since_measure) = 0;'
            - script.execute: measure
